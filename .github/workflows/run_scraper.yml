name: Otomasi Scraping & Update WebGIS Karhutla

on:
  schedule:
    # 01:00 AM WIB setara dengan 18:00 UTC (H-1)
    - cron: '0 18,21,0,3,6,9,12,15 * * *'
  workflow_dispatch:

permissions:
  contents: write

# SIFAT GLOBAL: MENGUBAH ZONA WAKTU SERVER MENJADI WIB (ASIA/JAKARTA)
env:
  TZ: 'Asia/Jakarta'

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repositori
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies (GDAL/GEOS)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin libgeos-dev

      - name: Install Python Libraries
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas geopandas folium shapely urllib3

      - name: Jalankan Script Main.py
        # Melewatkan environment variable TZ ke dalam eksekusi Python
        env:
          TZ: 'Asia/Jakarta'
        run: python assets/main.py

      - name: Commit & Push Output Terbaru ke GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ stats.json peta.html
          git commit -m "Auto-update data hotspot [$(TZ='Asia/Jakarta' date +'%Y-%m-%d %H:%M WIB')]" || exit 0
          git push
